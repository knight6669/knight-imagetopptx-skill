<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Knight ImageToPPTX Skill animated banner</title>
  <desc id="desc">A minimalist animated illustration showing slide images being rebuilt into editable PowerPoint objects.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5CFF"/>
      <stop offset="1" stop-color="#003AAE"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20D3C2"/>
      <stop offset="1" stop-color="#0A8FDC"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6FAFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B2E6F" flood-opacity=".12"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="flowPathA" d="M 374 260 C 498 260 527 170 640 170"/>
    <path id="flowPathB" d="M 960 260 C 1084 260 1108 168 1240 168"/>
    <style>
      .ink { stroke: #102A56; }
      .blue { stroke: #0757D8; }
      .teal { stroke: #14B8C9; }
      .muted { stroke: #AFC4E8; }
      .panel { fill: url(#soft); stroke: #BFD1F3; }
      .hairline { vector-effect: non-scaling-stroke; }
      .dash {
        stroke-dasharray: 8 14;
        animation: dash 5s linear infinite;
      }
      .float-a { animation: floatA 7s ease-in-out infinite; transform-origin: center; }
      .float-b { animation: floatB 8s ease-in-out infinite; transform-origin: center; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse-late { animation: pulse 2.8s ease-in-out infinite .9s; transform-origin: center; }
      .selection { animation: selection 3.4s ease-in-out infinite; transform-origin: center; }
      .pixel { animation: pixelDrift 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pixel:nth-of-type(2n) { animation-delay: .4s; }
      .pixel:nth-of-type(3n) { animation-delay: .8s; }
      .rail { animation: rail 7s ease-in-out infinite; }
      .spark { filter: url(#glow); opacity: 0; }
      @keyframes dash {
        to { stroke-dashoffset: -88; }
      }
      @keyframes floatA {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(7px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: .46; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes selection {
        0%, 100% { opacity: .72; }
        50% { opacity: 1; }
      }
      @keyframes pixelDrift {
        0%, 100% { opacity: .28; transform: translate(0, 0) scale(.92); }
        50% { opacity: 1; transform: translate(16px, -10px) scale(1); }
      }
      @keyframes rail {
        0%, 100% { opacity: .18; }
        45%, 60% { opacity: .62; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dash, .float-a, .float-b, .pulse, .pulse-late, .selection, .pixel, .rail { animation: none !important; }
      }
    </style>
  </defs>

