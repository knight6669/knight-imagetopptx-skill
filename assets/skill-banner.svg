    <filter id="tinyShadow" x="-10%" y="-18%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#123B7A" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#0B5CFF"/>
    </marker>
    <style>
      .panel { fill: url(#softPanel); stroke: #C4D6F5; stroke-width: 1.4; filter: url(#shadow); }
      .tile { fill: #FFFFFF; stroke: #C9D9F4; stroke-width: 1.3; filter: url(#tinyShadow); }
      .thin { stroke: #D7E3F7; stroke-width: 1.1; }
      .blueStroke { stroke: #0B5CFF; }
      .aquaStroke { stroke: #18BFD2; }
      .muted { fill: #6D7F9D; }
      .ink { fill: #102A56; }
      .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #6D7F9D; }
      .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 0; fill: #0E2B57; }
      .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0; fill: #526886; }
      .small { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #244260; }
    </style>
  </defs>

