<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="280" viewBox="0 0 1600 280" role="img" aria-labelledby="title desc">
  <title id="title">Knight ImageToPPTX Skill banner</title>
  <desc id="desc">A compact premium diagram showing image, PPTX, and PDF pages being rebuilt into editable PowerPoint objects.</desc>
  <defs>
